name: Bible and Conflict Upload-Only Bundle

on:
  push:
    branches: [build/conflict-google-return-1.0.11]
    paths:
      - .github/workflows/conflict-upload-only.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conflict-upload-only-12-google-return
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out only the standalone Bible and Conflict source
        uses: actions/checkout@v4
        with:
          repository: tryjesusmedia/bibleandconflict
          ref: 48b103c8e5e2931df38fbd416b3238450d3b474c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:auth-callback
      - run: npm run test:account-isolation
      - name: Connect to existing Android signing credentials
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed Android upload file only
        run: eas build --platform android --profile production --local --non-interactive --freeze-credentials --output bible-and-conflict-1.0.11-build-12.aab
      - name: Verify signed bundle
        run: jarsigner -verify bible-and-conflict-1.0.11-build-12.aab
      - uses: actions/upload-artifact@v4
        with:
          name: bible-and-conflict-1.0.11-build-12
          path: bible-and-conflict-1.0.11-build-12.aab
          if-no-files-found: error
          retention-days: 30
# Intentionally no publishing or Google Play submission steps.
