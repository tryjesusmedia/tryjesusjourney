name: Android Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - fix/bible-decoded-image-fit-build23
    paths:
      - .github/workflows/eas-android-production.yml
      - .github/eas-build-trigger

permissions:
  contents: read

concurrency:
  group: android-image-fit-build23
  cancel-in-progress: false

jobs:
  build:
    name: Build Google Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out app source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type-check app
        run: npm run typecheck

      - name: Lint app
        run: npm run lint

      - name: Test sign-in callback handling
        run: npm run test:auth-callback

      - name: Validate the document edition and existing reader behavior
        run: |
          node --experimental-strip-types scripts/test-chronological-navigation.mjs
          node scripts/test-document-plan.mjs
          node scripts/test-document-progress.cjs
          npm run test:chronological-state
          npm run test:bible-reader
          npm run test:journey-rewards
          npm run test:home-guide-ui

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo account
        run: eas whoami

      - name: Build production Android App Bundle
        run: eas build --platform android --profile production --local --non-interactive --freeze-credentials --output try-jesus-the-journey.aab

      - name: Verify signed App Bundle
        run: jarsigner -verify try-jesus-the-journey.aab

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: try-jesus-the-journey-build23-aab
          path: try-jesus-the-journey.aab
          if-no-files-found: error
          retention-days: 14

      - name: Prepare an emulator-only install from the release bundle
        run: |
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle try-jesus-the-journey.aab > /dev/null
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator-only.keystore" -alias androiddebugkey -storepass android -keypass android -dname "CN=Ephemeral Layout Test" -keyalg RSA -validity 2
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle try-jesus-the-journey.aab --output "$RUNNER_TEMP/layout-test.apks" --mode universal --ks "$RUNNER_TEMP/emulator-only.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android
          unzip -p "$RUNNER_TEMP/layout-test.apks" universal.apk > universal.apk

      - name: Enable the ephemeral emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check the real Android layout at normal and narrow phone widths
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: python3 scripts/test-decoded-android.py

      - name: Retain internal Android layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-android-layout-build23
          path: android-layout-report
          if-no-files-found: ignore
          retention-days: 7
