name: Android Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-android-production.yml
      - .github/eas-build-trigger

permissions:
  contents: read

concurrency:
  group: android-production-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Google Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out app source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type-check app
        run: npm run typecheck

      - name: Lint app
        run: npm run lint

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo account
        run: eas whoami

      - name: Build production Android App Bundle
        run: eas build --platform android --profile production --local --non-interactive --output try-jesus-the-journey.aab

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: try-jesus-the-journey-android-aab
          path: try-jesus-the-journey.aab
          if-no-files-found: error
          retention-days: 14
