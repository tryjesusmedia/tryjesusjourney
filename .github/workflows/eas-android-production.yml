name: Android Production Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-android-production.yml
      - .github/eas-build-trigger

permissions:
  contents: read

concurrency:
  group: android-production-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Google Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out app source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check app
        run: npm run typecheck

      - name: Lint app
        run: npm run lint

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo account
        run: eas whoami

      - name: Build production Android App Bundle
        run: eas build --platform android --profile production --non-interactive --wait --json > eas-build.json

      - name: Download App Bundle
        shell: bash
        run: |
          AAB_URL="$(node -e "const fs=require('fs');const raw=JSON.parse(fs.readFileSync('eas-build.json','utf8'));const build=Array.isArray(raw)?raw[0]:raw;const url=build?.artifacts?.buildUrl||build?.artifacts?.applicationArchiveUrl;if(!url)throw new Error('EAS did not return an Android build artifact URL.');process.stdout.write(url);")"
          curl --silent --show-error --fail --location --retry 3 "$AAB_URL" --output try-jesus-the-journey.aab

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: try-jesus-the-journey-android-aab
          path: try-jesus-the-journey.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload EAS build details
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-details
          path: eas-build.json
          if-no-files-found: error
          retention-days: 14
