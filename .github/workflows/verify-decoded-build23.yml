name: Verify the installed Bible Decoded build 23
on:
  push:
    branches: [verify/bible-decoded-build23]
    paths: [.github/workflows/verify-decoded-build23.yml, scripts/test-decoded-android.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: try-jesus-the-journey-build23-aab
          run-id: 39630049275
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the existing bundle for an ephemeral emulator
        run: |
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator-only.keystore" -alias androiddebugkey -storepass android -keypass android -dname "CN=Ephemeral Layout Test" -keyalg RSA -validity 2
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle try-jesus-the-journey.aab --output "$RUNNER_TEMP/layout-test.apks" --mode universal --ks "$RUNNER_TEMP/emulator-only.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android
          unzip -p "$RUNNER_TEMP/layout-test.apks" universal.apk > universal.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the installed Android image bounds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          script: python3 scripts/test-decoded-android.py
      - name: Retain internal Android screen checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-android-layout-build23-verified
          path: android-layout-report
          if-no-files-found: ignore
          retention-days: 7
