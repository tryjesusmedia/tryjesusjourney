name: Bible and Conflict Android Release

on:
  workflow_dispatch:
    inputs:
      submit_to_play:
        description: Submit the new bundle using the configured Google Play service account
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/eas-conflict-production.yml

permissions:
  contents: read

concurrency:
  group: conflict-android-production-build
  cancel-in-progress: false

# Use the existing publisher's Expo connection. Checkout and signing identity
# belong to the standalone Conflict app, not the Journey app.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Bible and Conflict release source
        uses: actions/checkout@v4
        with:
          repository: tryjesusmedia/bibleandconflict
          ref: b6b935bbc5d933496edafb32e9e2b6aca707f4a6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:auth-callback
      - run: npm run test:account-isolation
      - name: Connect to the existing Expo publisher
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build standalone Android bundle
        run: eas build --platform android --profile production --local --non-interactive --freeze-credentials --output bible-and-conflict.aab
      - uses: actions/upload-artifact@v4
        with:
          name: bible-and-conflict-android-6-lion-lamb-icon
          path: bible-and-conflict.aab
          if-no-files-found: error
          retention-days: 14
      - name: Submit Bible and Conflict to Google Play production
        if: github.event_name == 'workflow_dispatch' && inputs.submit_to_play
        run: eas submit --platform android --profile production --path bible-and-conflict.aab --non-interactive --wait
